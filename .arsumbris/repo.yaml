type: au.engine.repo::au-engine
name: lux-legal-batch-1
remote: git@github.com:OpulentiaAI/lux-legal-batch-1.git
description: >
  Luxembourg company-law corpus (Opulentia Batch 1, François Bernard) mapped as a
  typed knowledge graph: documents, authors, topics, structure, statute articles and
  retrieval chunks — plus the lx_* turbopuffer-backed discovery tools for au-mcp.
  Text extraction stays local; licensed treatises are not redistributed.
deps:
  - name: au-base-types
  - name: au-mcp-sdk
  - name: au-ingest
  # Host-side packages referenced by workspace-layout.yaml. Declared directly so
  # the mount is self-describing instead of relying on discover: host-bundle.
  - name: au-host-sdk
  - name: aup-reader
  - name: aup-workspace-sidebar
  - name: bento
  - name: column
  - name: editor
  - name: file-tree
  - name: force-graph
  - name: intent
  - name: media-viewers
  - name: placeholder-picker
  - name: sandwich
  - name: tabs
